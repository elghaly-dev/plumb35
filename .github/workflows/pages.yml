# Deploys the static sales site to GitHub Pages.
# If Actions billing blocks runners, switch Pages source to branch main / (root).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build public site artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          # Everything the page actually references, plus crawler files.
          cp index.html 404.html i18n.js app.js .nojekyll _site/
          cp favicon.png favicon.svg logo.png robots.txt sitemap.xml site.webmanifest _site/
          cp brand-35-plumb.jpg logo-plumb-35.png logo-plumb-35.svg _site/
          cp board-full-arb.png board-partial-350.png _site/
          cp -R assets _site/assets
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Verify every referenced asset shipped
        run: |
          set -euo pipefail
          # Pull local src/href targets out of the built page and confirm each exists.
          # The loop runs in a subshell, so failures are collected in a file.
          grep -oE '(src|href)="[^":#]+"' _site/index.html \
            | sed -E 's/^(src|href)="//; s/"$//' \
            | grep -vE '^(https?:|mailto:|//)' \
            | sort -u > refs.txt
          : > missing.txt
          while read -r ref; do
            if [ ! -f "_site/$ref" ]; then
              echo "::error::missing asset: $ref"
              echo "$ref" >> missing.txt
            fi
          done < refs.txt
          if [ -s missing.txt ]; then
            echo "Build is missing $(wc -l < missing.txt) referenced asset(s)."
            exit 1
          fi
          echo "All $(wc -l < refs.txt) referenced assets present."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
